name: folio_core
description: >-
  The logic of Fan Folio, with no Flutter in it: the schema, the library
  query, archive parsing, pacing and queue persistence. Pure Dart so behaviour
  can be tested independently of the Flutter UI and Android lifecycle.
publish_to: none
version: 4.0.0-alpha.2

environment:
  sdk: ^3.5.0

dependencies:
  # The html5 parsing algorithm, in pure Dart. Fic markup is written by hand
  # over twenty years and is not well-formed; a parser that recovers the way
  # browsers recover is the difference between a chapter and a mess.
  html: ^0.15.4
  # Asking the archive for a page. Here rather than in the Flutter half so the
  # client can be tested against a fake without a phone — which is the whole
  # reason this package exists.
  http: ^1.2.0
  # Retry-After may be a date rather than a count of seconds, and an HTTP date
  # is fiddly enough to be worth not writing again. Already under http; named
  # here because this imports it.
  http_parser: ^4.0.0
  # A picture is stored under the hash of its bytes, so the same image
  # referenced from two chapters is recognisably the same image.
  crypto: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  sqlite3: ^2.4.0
