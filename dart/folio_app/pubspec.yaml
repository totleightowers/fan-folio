name: folio_app
description: Fan Folio 2 — your saved fiction, offline and searchable.
publish_to: none
version: 2.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  folio_core:
    path: ../folio_core
  # The library is one SQLite file, the same file 1.x wrote.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # Works carrying an author's skin are read here rather than as native text,
  # because the skin is the work: a chat fic, a letter in another hand.
  webview_flutter: ^4.10.0
  # Bringing a library in from a 1.x backup. The alpha has its own private
  # storage and cannot see the 1.x app's, so the file has to be handed over.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Without this the Material icon font is not bundled, and every Icons.*
  # codepoint falls through to whatever font on the device happens to have a
  # glyph there — which on Android is a CJK fallback. The search icon came out
  # as 庸 and the library icon as an empty box.
  uses-material-design: true

  assets:
    # The archive's own stylesheet, vendored in 1.x and travelling with the
    # app for the same reason: a work skin is written against it, and without
    # it a skinned chapter is styled against nothing.
    - assets/ao3-work.css

  # The face the library is read in, and the face its titles are set in. It
  # ships with the app so it is there with no connection and never quietly
  # falls back to something else on the way. SIL Open Font License; the text
  # of it sits beside the file, which is the condition of shipping it.
  fonts:
    - family: Literata
      fonts:
        - asset: fonts/Literata.ttf
    # Drawn by the Braille Institute for low vision readers: the letters that
    # usually collapse into each other — I l 1, O 0, b d — are drawn to be
    # told apart. Four cut files rather than one, so italics in a fic are the
    # designer's italics and not a slant the engine applied to the roman.
    - family: Atkinson Hyperlegible
      fonts:
        - asset: fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: fonts/AtkinsonHyperlegible-BoldItalic.ttf
          style: italic
          weight: 700
