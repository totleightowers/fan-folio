# The app itself has no dependencies — nothing is installed at build or run
# time, which is the point. So Dependabot's job here is the CI supply chain:
# the actions this repo trusts to build and sign an APK, and the tools CI
# installs beside the checkout to test it.
#
# Dependabot only sees a version written in a manifest. The tools were pinned
# inside workflow steps, where it cannot look, so each has a manifest of its
# own under .github/tools and the workflow installs from that.
#
# Still raised by hand, because Dependabot follows none of them: gitleaks (a
# release download with a checksum), the Flutter SDK (held on purpose), the
# Android platform and build-tools, and the Node and Java versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    # CodeQL's init and analyze steps must be on the same version: bump one and
    # leave the other and every analysis fails with "Not all workflow steps that
    # use `github/codeql-action` actions use the same version". Dependabot
    # raises one pull request per action path, so ungrouped it produces a pair
    # that cannot be merged one at a time — whichever went first would break
    # CodeQL on main until the other followed. Grouped, they arrive together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The root package.json declares nothing and is listed so that it stays
  # watched if it ever does. The other two are ESLint and Playwright.
  - package-ecosystem: npm
    directories:
      - /
      - /.github/tools/lint
      - /.github/tools/browser
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
  # Semgrep, which releases most weeks; monthly is often enough for a linter.
  - package-ecosystem: pip
    directory: /.github/tools/semgrep
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
