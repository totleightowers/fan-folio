name: Android download service

on:
  pull_request:
    paths:
      - 'dart/**'
      - '.github/workflows/flutter-service-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-test-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          cache: true
      - name: Start Android emulator
        run: |
          export PATH="/usr/local/lib/android/sdk/platform-tools:$PATH"
          echo /usr/local/lib/android/sdk/platform-tools >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/folio-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sudo chmod 666 /dev/kvm
          df -h /
          trap 'cat /tmp/emulator.log || true' ERR
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo no | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager create avd -n folio-service -k 'system-images;android-35;google_apis;x86_64' --force
          "/usr/local/lib/android/sdk/emulator/emulator" -avd folio-service -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          test -f "$ANDROID_AVD_HOME/folio-service.ini"
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            echo "Waiting for Android boot: $attempt"
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
      - name: Build service integration test
        working-directory: dart/folio_app
        run: |
          flutter pub get
          ./tool/android.sh
          flutter build apk --debug --target integration_test/download_service_test.dart
          adb install -g build/app/outputs/flutter-apk/app-debug.apk
      - name: Run on Android
        working-directory: dart/folio_app
        run: |
          # Launch without the Flutter CLI's paused-at-start VM attachment.
          # The integration-test APK runs its assertions and emits the result.
          adb logcat -c
          adb shell am start -W -n org.fanfolio.preview/org.fanfolio.folio_app.MainActivity
          for attempt in $(seq 1 90); do
            adb logcat -d > /tmp/service-logcat.txt
            if grep -q FOLIO_SERVICE_TEST_FAILED /tmp/service-logcat.txt; then
              cat /tmp/service-logcat.txt
              exit 1
            fi
            if grep -q FOLIO_SERVICE_TEST_PASSED /tmp/service-logcat.txt; then
              cat /tmp/service-logcat.txt
              exit 0
            fi
            echo "Waiting for service test: $attempt"
            sleep 2
          done
          cat /tmp/service-logcat.txt
          exit 1
      - name: Capture Android diagnostics
        if: always()
        run: |
          cat /tmp/emulator.log || true
          timeout 15 adb logcat -d > /tmp/service-logcat.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-service-diagnostics
          path: |
            /tmp/emulator.log
            /tmp/service-logcat.txt
