name: Flutter preview release

on:
  push:
    tags: ['v4.*']

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Verify core
        working-directory: dart/folio_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Verify app
        working-directory: dart/folio_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Restore project signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
      - name: Build isolated preview
        working-directory: dart/folio_app
        env:
          FOLIO_KEYSTORE: ${{ runner.temp }}/preview.jks
          FOLIO_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          test -n "$FOLIO_KEYSTORE_PASS"
          ./tool/android.sh
          flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$(git rev-list --count HEAD)"
          cp build/app/outputs/flutter-apk/app-release.apk ../../fanfolio-preview.apk
      - name: Publish alpha alongside stable v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: fanfolio-preview.apk
          prerelease: true
          make_latest: 'false'
          body_path: docs/flutter-preview-release.md
          generate_release_notes: false
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/preview.jks"
