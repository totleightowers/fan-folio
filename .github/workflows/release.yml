name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Tests must pass before anything ships
        run: npm test

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            echo "signed=real" >> "$GITHUB_OUTPUT"
          else
            echo "signed=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'ci-ephemeral' }}
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          mkdir -p android/sdk
          cp "$ANDROID_HOME/platforms/android-34/android.jar" android/sdk/android.jar
          cd android && ./build.sh

      - name: Release notes
        run: |
          {
            echo "Install on Android: download \`fanfolio.apk\` and open it."
            echo
            if [ "${{ steps.key.outputs.signed }}" = "real" ]; then
              echo "Signed with the project key, so it installs over a previous version."
            else
              echo "> **Signed with a throwaway CI key.** It will not install over an"
              echo "> existing copy — uninstall first, or add \`KEYSTORE_BASE64\` and"
              echo "> \`KEYSTORE_PASS\` as repository secrets so releases are signed properly."
            fi
          } > NOTES.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: android/fanfolio.apk
          body_path: NOTES.md
          generate_release_notes: true

      - name: Never leave a key on the runner
        if: always()
        run: rm -f android/keystore.jks
