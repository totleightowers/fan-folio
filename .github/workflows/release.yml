name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version code is the number of commits, and a shallow clone has
          # one of them — so every release so far has shipped versionCode 1.
          # Android will reinstall over an equal code but cannot order them,
          # and a rewrite that has to install over its predecessor needs the
          # ordering to be real.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Which Fan Folio this tag is
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "major=${NAME%%.*}" >> "$GITHUB_OUTPUT"
          # An alpha sits beside 1.x under its own id; only a plain 2.x.y
          # takes org.fanfolio and inherits the library in place.
          case "$NAME" in
            2.*-*) echo "appid=org.fanfolio.next" >> "$GITHUB_OUTPUT" ;;
            *)     echo "appid=org.fanfolio" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tests must pass before anything ships
        run: npm test

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            echo "signed=real" >> "$GITHUB_OUTPUT"
          else
            echo "signed=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the WebView app
        if: steps.version.outputs.major == '1'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'ci-ephemeral' }}
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          mkdir -p android/sdk
          cp "$ANDROID_HOME/platforms/android-34/android.jar" android/sdk/android.jar
          cd android && ./build.sh

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: steps.version.outputs.major == '2'
        with:
          channel: stable
          cache: true

      - name: Build the Flutter app
        if: steps.version.outputs.major == '2'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'ci-ephemeral' }}
          APP_ID: ${{ steps.version.outputs.appid }}
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          cd dart/folio_app
          flutter pub get
          flutter test
          ./tool/android.sh
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

          BUILT=build/app/outputs/flutter-apk/app-release.apk

          # Re-signed with the project key rather than whatever Flutter had to
          # hand. A CI runner generates a fresh debug key every time, so an
          # app signed with one cannot be updated by the next build of itself.
          if [ -f "$GITHUB_WORKSPACE/android/keystore.jks" ]; then
            zip -q -d "$BUILT" 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.MF' || true
            zipalign -f 4 "$BUILT" aligned.apk
            apksigner sign \
              --ks "$GITHUB_WORKSPACE/android/keystore.jks" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --out "$GITHUB_WORKSPACE/fanfolio2.apk" aligned.apk
          else
            cp "$BUILT" "$GITHUB_WORKSPACE/fanfolio2.apk"
          fi

      - name: Release notes
        run: |
          {
            if [ "${{ steps.version.outputs.major }}" = "2" ]; then
              echo "Install on Android: download \`fanfolio2.apk\` and open it."
              echo
              if [ "${{ steps.version.outputs.appid }}" = "org.fanfolio.next" ]; then
                echo "> **This is Fan Folio 2, in progress.** It installs *beside*"
                echo "> your 1.x app rather than replacing it, under its own name, so"
                echo "> nothing you rely on is touched. It starts with an empty"
                echo "> library of its own."
                echo
              fi
            else
              echo "Install on Android: download \`fanfolio.apk\` and open it."
            fi
            echo
            if [ "${{ steps.key.outputs.signed }}" = "real" ]; then
              echo "Signed with the project key, so it installs over a previous version."
            else
              echo "> **Signed with a throwaway CI key.** It will not install over an"
              echo "> existing copy — uninstall first, or add \`KEYSTORE_BASE64\` and"
              echo "> \`KEYSTORE_PASS\` as repository secrets so releases are signed properly."
            fi
          } > NOTES.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            android/fanfolio.apk
            fanfolio2.apk
          body_path: NOTES.md
          generate_release_notes: true

      - name: Never leave a key on the runner
        if: always()
        run: rm -f android/keystore.jks
