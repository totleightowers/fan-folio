name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version code is the number of commits, and a shallow clone has
          # one of them — so every release so far has shipped versionCode 1.
          # Android will reinstall over an equal code but cannot order them,
          # and a rewrite that has to install over its predecessor needs the
          # ordering to be real.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Which Fan Folio this tag is
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          NAME="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "major=${NAME%%.*}"
            echo "code=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Tests must pass before anything ships
        run: npm test

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            echo "signed=real" >> "$GITHUB_OUTPUT"
          else
            echo "signed=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      # One app. 2.x is this one, grown up — the Flutter rewrite is put down,
      # and its ideas came back here rather than its code.
      - name: Build the app
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'ci-ephemeral' }}
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          mkdir -p android/sdk
          cp "$ANDROID_HOME/platforms/android-34/android.jar" android/sdk/android.jar
          cd android && ./build.sh

      - name: Release notes
        run: |
          {
            echo "Install on Android: download \`fanfolio.apk\` and open it."
            echo
            if [ "${{ steps.key.outputs.signed }}" = "real" ]; then
              echo "Signed with the project key, so it installs over a previous version."
            else
              echo "> **Signed with a throwaway CI key.** It will not install over an"
              echo "> existing copy — uninstall first, or add \`KEYSTORE_BASE64\` and"
              echo "> \`KEYSTORE_PASS\` as repository secrets so releases are signed properly."
            fi
          } > NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            android/fanfolio.apk
          body_path: NOTES.md
          generate_release_notes: false

      - name: Never leave a key on the runner
        if: always()
        run: rm -f android/keystore.jks
